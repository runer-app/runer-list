# When app/, server/ or protocol/ changes: lint, types, formatting, the unit
# tests and the e2e suite against the real server.
name: app-ci

on:
  push:
    branches: [main]
    paths: [app/**, server/**, protocol/**, .github/workflows/app-ci.yml]
  pull_request:
    paths: [app/**, server/**, protocol/**, .github/workflows/app-ci.yml]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Tauri 2 on Linux (the app crate is in the Cargo workspace, so `cargo test` builds it).
  TAURI_DEPS: libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev libdbus-1-dev pkg-config

defaults:
  run:
    working-directory: app

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: app
      - run: sudo apt-get update && sudo apt-get install -y $TAURI_DEPS
      - run: npm ci
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      # After `npm test`, which builds the Node add-on the e2e suite loads. The
      # real server and PostgreSQL (Docker is on the runner).
      - run: e2e/against-server.sh

