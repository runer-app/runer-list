[package]
name = "runer-app"
version = "0.1.7"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "runer_app"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
runer-crypto = { path = "../../../crates/runer-crypto" }
runer-vault = { path = "../../../crates/runer-vault" }
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1.9.0"
rusqlite = { version = "0.40", features = ["bundled"] }
time = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
tokio = { version = "1", features = ["sync", "time"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
url = "2"

[target.'cfg(not(target_os = "ios"))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

# `keyring` can't set a keychain item's accessibility class.
[target.'cfg(target_os = "ios")'.dependencies]
security-framework = "3"
# BGTaskScheduler, for the background refresh (`wake.rs`).
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSDate", "NSError", "NSString"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-updater = "2"
