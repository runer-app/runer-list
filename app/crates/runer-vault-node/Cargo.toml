[package]
name = "runer-vault-node"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
runer-vault = { path = "../runer-vault" }
napi = { version = "3.13.0", default-features = false, features = ["napi6"] }
napi-derive = "3.6.9"

[build-dependencies]
napi-build = "2.5.0"
