[package]
name = "runer-crypto"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aes-gcm = "0.11.1"
bip39 = "3.0.0"
ed25519-dalek = "3.0.0"
getrandom = "0.4.3"
hkdf = "0.13.0"
hmac = "0.13.0"
hpke = { version = "0.14.1", default-features = false, features = ["alloc", "getrandom", "x25519", "aes", "hkdfsha2"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
zeroize = "1.9.0"

[dev-dependencies]
hex = "0.4.3"
